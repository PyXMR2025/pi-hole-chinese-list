name: Update easylist.hosts daily

# 触发条件：每天 UTC 0 点执行，也支持手动触发
on:
  schedule:
    - cron: '0 0 * * *'  # UTC 0点，对应北京时间 8 点
  workflow_dispatch:  # 允许手动触发，方便测试

# 设置工作流权限
permissions:
  contents: write  # 授予写入仓库内容的权限

jobs:
  update-hosts:
    runs-on: ubuntu-latest  # 使用 Ubuntu 最新版运行环境
    steps:
      # 步骤1：检出 master 分支的代码
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          ref: master  # 指定检出 master 分支

      # 步骤2：执行抓取和处理命令
      - name: Fetch and process easylist files
        run: |
          # 抓取多个 easylist 相关文件并合并
          curl -s -L \
            https://easylist.to/easylist/easylist.txt \
            https://easylist.to/easylist/fanboy-annoyance.txt \
            https://easylist.to/easylist/fanboy-social.txt \
            https://easylist-downloads.adblockplus.org/easylistchina.txt \
            https://easylist-downloads.adblockplus.org/malwaredomains_full.txt \
            https://github.com/cjx82630/cjxlist/blob/master/cjxlist.txt \
            https://big.oisd.nl/ \
            https://anti-ad.net/easylist.txt \
            https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/pro.plus.txt \
            > easylist
          
          # 去重、过滤符合格式的域名、移除包含 / 的行
          sort -u easylist | grep ^\|\|.*\^$ | grep -v \/ > easylist.sorted
          
          # 移除 || 和 ^ 符号，生成最终的 hosts 格式文件
          sed 's/[\|^]//g' < easylist.sorted > easylist.hosts
          
          # 删除临时文件
          rm easylist easylist.sorted
          
          # 查看文件行数，验证处理结果（可选）
          echo "Generated easylist.hosts with $(wc -l < easylist.hosts) lines"

      # 步骤3：提交并推送修改到 master 分支
      - name: Commit and push changes
        run: |
          # 配置 git 提交信息
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 检查文件是否有变更
          if git status --porcelain | grep -q 'easylist.hosts'; then
            # 提交变更
            git add easylist.hosts
            git commit -m "Update easylist.hosts $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            # 推送到 master 分支
            git push origin master
            echo "Successfully updated easylist.hosts"
          else
            echo "No changes to easylist.hosts, skip commit"
          fi
